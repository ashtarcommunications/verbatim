<!doctype html>
<html>
	<head>
		<link rel="stylesheet" type="text/css" href="cite.css" />
		<link rel="stylesheet" type="text/css" href="options.css" />
		<script src="vendor/browser-polyfill.min.js"></script>
		<script src="popup.js"></script>
	</head>

	<body>
		<div id="verbatim-popup-wrapper">
			<h3>Verbatim</h3>
			<div class="switch">
				<input
					type="checkbox"
					name="switch"
					class="switch-checkbox"
					id="switch"
					checked
				/>
				<label class="switch-label" for="switch">
					<span class="switch-inner"></span>
					<span class="switch-switch"></span>
				</label>
			</div>

			<div id="instructions">
				<p>Default shortcuts use Alt on PC, Option on Mac.</p>
				<code>ctrl+alt+1</code> / <code>ctrl+option+1</code> - Do stuff
				<br />
			</div>

			<br />

			<div id="verbatim-popup-options">
				<a id="options-link">Options</a>
			</div>
		</div>
	</body>
</html>
