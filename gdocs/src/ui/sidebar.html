<!doctype html>
<html>
	<head>
		<base target="_top" />
		<!-- Applies Google styling to buttons and other elements. -->
		<link
			rel="stylesheet"
			href="https://ssl.gstatic.com/docs/script/css/add-ons1.css"
		/>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
			crossorigin="anonymous"
		/>
		<link rel="stylesheet" href="./sidebar.css" />
	</head>

	<body>
		<div class="sidebar">
			<div class="tabs">
				<ul>
					<li class="active" data-tab="speech">Paperless</li>
					<li data-tab="vTub">vTub</li>
					<li data-tab="caselist">Caselist</li>
					<li data-tab="settings">Settings</li>
				</ul>
			</div>
			<div class="page active" id="speech">
				<div class="section">
					<h2><i class="icon fas fa-comments"></i> Speech</h2>
					<div class="full">
						<div class="split-button" aria-label="Send to Speech">
							<button class="main-action" title="Send to Speech (` key)">
								<i class="icon fas fa-arrow-right"></i>Send to Speech
							</button>
							<div class="dropdown-container">
								<button class="dropdown-toggle">
									<i class="icon fas fa-caret-down"></i>
								</button>
								<div class="dropdown-menu">
									<ul>
										<li>
											<button>
												<i class="icon fas fa-angles-right"></i>Send To Speech
												End
											</button>
										</li>
										<li>
											<button>
												<i class="icon fas fa-list-check"></i>Select Heading and
												Content
											</button>
										</li>
										<li>
											<button>
												<i class="icon fas fa-arrow-down"></i>Move Heading Down
											</button>
										</li>
										<li>
											<button>
												<i class="icon fas fa-arrow-up"></i>Move Heading Up
											</button>
										</li>
										<li>
											<button>
												<i class="icon fas fa-angles-down"></i>Move To Bottom
											</button>
										</li>
									</ul>
								</div>
							</div>
						</div>
					</div>
					<div id="current-speech">
						<p>Current Speech:</p>
						<button id="choose-speech">
							<span class="icon fas fa-object-group"></span>
							<br />
							<span>Choose Speech</span>
						</button>
					</div>
				</div>

				<div class="section">
					<h2><i class="icon fas fa-heading"></i> Organize</h2>
					<div class="quarters">
						<button id="paste">F2<br />Paste</button>
						<button id="condense">F3<br />Condense</button>
						<button id="pocket">F4<br />Pocket</button>
						<button id="hat">F5<br />Hat</button>
						<button id="block">F6<br />Block</button>
						<button id="tag">F7<br />Tag</button>
						<button id="cite">F8<br />Cite</button>
						<button id="underline">F9<br />Underline</button>
						<button id="emphasis">F10<br />Emphasis</button>
						<button id="highlight">F11<br />Highlight</button>
						<button id="clear">F12<br />Clear</button>
					</div>
				</div>

				<div class="section">
					<h2><i class="icon fas fa-wand-magic-sparkles"></i> Format</h2>
					<div class="halves">
						<div class="split-button" aria-label="Shrink">
							<button class="main-action" title="Shrink">
								<i class="icon fas fa-compress"></i><br />Shrink
							</button>
							<div class="dropdown-container">
								<button class="dropdown-toggle">
									<i class="icon fas fa-caret-down"></i>
								</button>
								<div class="dropdown-menu">
									<ul>
										<li>
											<button>
												<i class="icon fas fa-angles-right"></i>Shrink All
											</button>
										</li>
									</ul>
								</div>
							</div>
						</div>
						<select id="highlight-color">
							<option value="#ffff00">Yellow</option>
							<option value="#cccccc">Gray</option>
						</select>
					</div>
					<div class="quarters">
						<label class="checkbox-button" for="paragraph-integrity">
							<input
								type="checkbox"
								id="paragraph-integrity"
								data-id="ParagraphIntegrity"
							/>
							<i class="icon fa-solid fa-indent"></i>
						</label>
						<label class="checkbox-button" for="use-pilcrows">
							<input type="checkbox" id="use-pilcrows" data-id="UsePilcrows" />
							<i class="icon fa-solid fa-paragraph"></i>
						</label>
						<div class="dropdown-container">
							<button class="dropdown-toggle">
								Doc <i class="icon fas fa-caret-down"></i>
							</button>
							<div class="dropdown-menu">
								<div class="menu-sep">Automatic Fixers</div>
								<ul>
									<li>
										<button>
											<i class="icon fas fa-angles-right"></i>Fix Fake Tags
										</button>
									</li>
									<li>
										<button>
											<i class="icon fas fa-list-check"></i>Convert Analytics to
											Tags
										</button>
									</li>
									<li>
										<button>
											<i class="icon fas fa-arrow-down"></i>Fix Formatting Gaps
										</button>
									</li>
									<li>
										<button>
											<i class="icon fas fa-arrow-up"></i>Convert to Default
											Styles
										</button>
									</li>
									<li>
										<button>
											<i class="icon fas fa-angles-down"></i>Remove Extra Styles
										</button>
									</li>
									<li>
										<button>
											<i class="icon fas fa-angles-down"></i>Auto Number Tags
										</button>
									</li>
									<li>
										<button>
											<i class="icon fas fa-angles-down"></i>De-Number Tags
										</button>
									</li>
									<li>
										<button>
											<i class="icon fas fa-angles-down"></i>Insert Header
										</button>
									</li>
								</ul>

								<div class="menu-sep">Removal Tools</div>
								<ul>
									<li>
										<button>
											<i class="icon fas fa-angles-down"></i>Remove Emphasis
										</button>
									</li>
									<li>
										<button>
											<i class="icon fas fa-angles-down"></i>
											Remove Non-Highlighted Underlining
										</button>
									</li>
									<li>
										<button>
											<i class="icon fas fa-angles-down"></i>
											Remove Blanks
										</button>
									</li>
									<li>
										<button>
											<i class="icon fas fa-angles-down"></i>
											Remove Pilcrows
										</button>
									</li>
									<li>
										<button>
											<i class="icon fas fa-angles-down"></i>
											Remove Hyperlinks
										</button>
									</li>
									<li>
										<button>
											<i class="icon fas fa-angles-down"></i>
											Remove Bookmarks
										</button>
									</li>
								</ul>
							</div>
						</div>

						<div class="dropdown-container">
							<button class="dropdown-toggle">
								Card <i class="icon fas fa-caret-down"></i>
							</button>
							<div class="dropdown-menu">
								<div class="menu-sep">Condense</div>
								<ul>
									<li>
										<button>
											<i class="icon fas fa-angles-right"></i>Condense No
											Pilcrows
										</button>
									</li>
									<li>
										<button>
											<i class="icon fas fa-list-check"></i>Condense With
											Pilcrows
										</button>
									</li>
									<li>
										<button>
											<i class="icon fas fa-arrow-down"></i>Uncondense
										</button>
									</li>
								</ul>

								<div class="menu-sep">Highlighting</div>
								<ul>
									<li>
										<button>
											<i class="icon fas fa-arrow-up"></i>Standardize
											Highlighting
										</button>
									</li>
									<li>
										<button>
											<i class="icon fas fa-arrow-up"></i>Standardize
											Highlighting With Exception
										</button>
									</li>
								</ul>

								<div class="menu-sep">Card Formatting</div>
								<ul>
									<li>
										<button>
											<i class="icon fas fa-angles-down"></i>Auto-Emphasize
											First
										</button>
									</li>
								</ul>

								<div class="menu-sep">Cite Formatting</div>
								<ul>
									<li>
										<button>
											<i class="icon fas fa-angles-down"></i>Duplicate Cite
										</button>
									</li>
									<li>
										<button>
											<i class="icon fas fa-angles-down"></i>
											Auto Format Cite
										</button>
									</li>
									<li>
										<button>
											<i class="icon fas fa-angles-down"></i>
											Reformat All Cites
										</button>
									</li>
								</ul>
							</div>
						</div>
					</div>
				</div>

				<div class="section">
					<h2><i class="icon fas fa-file-import"></i> Paperless</h2>
					<div class="thirds">
						<div class="split-button" aria-label="Speech">
							<button class="main-action" title="Speech">
								<i class="icon fas fa-file-circle-plus"></i><br />Speech
							</button>
							<div class="dropdown-container">
								<button class="dropdown-toggle">
									<i class="icon fas fa-caret-down"></i>
								</button>
								<div class="dropdown-menu">
									<ul>
										<li>
											<button>
												<i class="icon fas fa-file-circle-plus"></i> Speech
											</button>
										</li>
									</ul>
								</div>
							</div>
						</div>
						<div class="split-button" aria-label="New">
							<button class="main-action" title="New">
								<i class="icon fas fa-file"></i><br />New
							</button>
							<div class="dropdown-container">
								<button class="dropdown-toggle">
									<i class="icon fas fa-caret-down"></i>
								</button>
								<div class="dropdown-menu">
									<ul>
										<li>
											<button>
												<i class="icon fas fa-file"></i>New Document
											</button>
										</li>
									</ul>
								</div>
							</div>
						</div>
						<button title="Share">
							<i class="icon fas fa-share-nodes"></i><br />Share
						</button>
					</div>
				</div>

				<div class="section">
					<h2><i class="icon fas fa-screwdriver-wrench"></i> Tools</h2>
					<div class="thirds">
						<button title="Stats">
							<i class="icon fas fa-chart-simple"></i><br />Stats
						</button>
						<div class="split-button" aria-label="Warrant">
							<button class="main-action" title="Warrant">
								<i class="icon fas fa-comment-dots"></i><br />Warrant
							</button>
							<div class="dropdown-container">
								<button class="dropdown-toggle">
									<i class="icon fas fa-caret-down"></i>
								</button>
								<div class="dropdown-menu">
									<ul>
										<li>
											<button>
												<i class="icon fas fa-angles-right"></i>New Warrant
											</button>
										</li>
									</ul>
								</div>
							</div>
						</div>
					</div>
					<div class="thirds">
						<input id="search-query" type="text" />
						<button id="search-button">Search</button>
						<div id="error-message"></div>
						<div id="picker-result"></div>
					</div>
					<div class="halves">
						<div><button id="styles">Set Styles</button></div>
						<div><button id="get-files">Get Files</button></div>
						<div><button id="get-doc">Get Doc</button></div>
						<div><button id="get-heading">Get Heading</button></div>
						<div><button id="export">Export Docx</button></div>
					</div>
				</div>

				<div class="section">
					<h2><i class="icon fas fa-eye"></i> View</h2>
					<div class="thirds">
						<label class="checkbox-button" for="invisibility">
							<input type="checkbox" id="invisibility" data-id="invisibility" />
							<i class="icon fa-solid fa-eye"></i><br />Invisibility
						</label>
					</div>
				</div>
			</div>

			<div class="page" id="vTub">
				<h2>vTub Settings</h2>
				<div><button id="create-vtub">Create Vtub</button></div>
			</div>

			<div class="page" id="caselist">Caselist</div>

			<div class="page" id="settings">Settings</div>
		</div>

		<script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
		<script
			type="text/javascript"
			src="https://cdnjs.cloudflare.com/ajax/libs/mousetrap/1.6.5/mousetrap.min.js"
		></script>
		<script
			src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"
			integrity="sha512-RXf+QSDCUQs5uwRKaDoXt55jygZZm2V++WUZduaU/Ui/9EGp3f/2KZVahFZBKGH0s774sd3HmrhUy+SgOFQLVQ=="
			crossorigin="anonymous"
		></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
		<script type="module" src="./sidebar.js"></script>
	</body>
</html>
