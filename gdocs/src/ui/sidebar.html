<!doctype html>
<html>
	<head>
		<base target="_top" />
		<link
			rel="stylesheet"
			href="https://ssl.gstatic.com/docs/script/css/add-ons1.css"
		/>
		<!-- The CSS package above applies Google styling to buttons and other elements. -->
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
			integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI1w=="
			crossorigin="anonymous"
		/>
		<link rel="stylesheet" href="./sidebar.css">
	</head>

	<body>
		<div class="sidebar">
			<div class="tabs">
				<ul>
					<li class="active">Paperless</li>
					<li>vTub</li>
					<li>Caselist</li>
					<li>Settings</li>
				</ul>
			</div>

			<div class="section">
				<h2>Paperless</h2>
				<div id="current-speech"><p>Current Speech:</p></div>
				<div class="thirds">
					<button id="send">
						<span class="icon fas fa-arrow-right"></span>
						<br />
						<span>Send to Speech</span>
					</button>
					<button id="choose-speech">
						<span class="icon fas fa-object-group"></span>
						<br />
						<span>Choose Speech</span>
					</button>
					<button id="new-speech">
						<span class="icon fas fa-file-alt"></span>
						<br />
						<span>New Speech</span>
					</button>
					<button id="select">
						<span class="icon fas fa-heading"></span>
						<br />
						<span>Select Heading</span>
					</button>
					<button id="moveup">
						<span class="icon fas fa-arrow-up"></span>
						<br />
						<span>Move Up</span>
					</button>
					<button id="movedown">
						<span class="icon fas fa-arrow-down"></span>
						<br />
						<span>Move Down</span>
					</button>
					<button id="copy">
						<span class="icon fas fa-copy"></span>
						<br />
						<span>Copy</span>
					</button>
				</div>
			</div>

			<div class="section">
				<h2>Format</h2>
				<div class="quarters">
					<button id="paste">F2<br />Paste</button>
					<button id="condense">F3<br />Condense</button>
					<button id="pocket">F4<br />Pocket</button>
					<button id="hat">F5<br />Hat</button>
					<button id="block">F6<br />Block</button>
					<button id="tag">F7<br />Tag</button>
					<button id="cite">F8<br />Cite</button>
					<button id="underline">F9<br />Underline</button>
					<button id="emphasis">F10<br />Emphasis</button>
					<button id="highlight">F11<br />Highlight</button>
					<button id="clear">F12<br />Clear</button>
					<button id="shrink">
						<span class="icon fas fa-compress-arrows-alt"></span>
						<br />
						<span>Shrink</span>
					</button>
				</div>
				<div class="halves">
					<div><button id="styles">Set Styles</button></div>
					<div><button id="invisibility-on">Invisibility On</button></div>
					<div><button id="invisibility-off">Invisibility Off</button></div>
					<div><button id="get-files">Get Files</button></div>
					<div><button id="get-doc">Get Doc</button></div>
					<div><button id="get-heading">Get Heading</button></div>
					<div><button id="create-vtub">Create Vtub</button></div>
					<div><button id="export">Export Docx</button></div>
				</div>
				<div class="halves">
					<select id="highlight-color">
						<option value="#ffff00">Yellow</option>
						<option value="#cccccc">Gray</option>
					</select>
					<input id="search-query" type="text" />
					<button id="search-button">Search</button>
					<div id="error-message"></div>
					<div id="picker-result"></div>
				</div>
			</div>
		</div>
		
		<script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
		<script
			type="text/javascript"
			src="https://cdnjs.cloudflare.com/ajax/libs/mousetrap/1.6.5/mousetrap.min.js"
		></script>
		<script
			src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"
			integrity="sha512-RXf+QSDCUQs5uwRKaDoXt55jygZZm2V++WUZduaU/Ui/9EGp3f/2KZVahFZBKGH0s774sd3HmrhUy+SgOFQLVQ=="
			crossorigin="anonymous"
		></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
		<script type="module" src="./sidebar.js"></script>
	</body>
</html>
